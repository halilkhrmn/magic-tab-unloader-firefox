name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach to its release (for example v0.2.0)"
        required: true
permissions:
  contents: write
env:
  TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check tag matches manifest version
        run: |
          version=$(node -p "require('./manifest.json').version")
          [ "v$version" = "$TAG" ] || { echo "Tag $TAG does not match manifest version $version"; exit 1; }
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip=$(ls web-ext-artifacts/*.zip)
          xpi="magic-tab-unloader-${TAG}.xpi"
          cp "$zip" "$xpi"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$zip" "$xpi" --clobber
          else
            gh release create "$TAG" --verify-tag --generate-notes "$zip" "$xpi"
          fi

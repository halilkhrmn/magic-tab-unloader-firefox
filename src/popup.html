<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="theme.css">
<style>
  body { width: 300px; padding: 12px; }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .card { margin-bottom: 10px; }
  .card .row:first-child { margin-top: 0; }
  .sub { margin-left: 22px; }
  .stats { display: flex; justify-content: space-between; margin-bottom: 10px; }
  .actions { display: grid; gap: 6px; }
  button { width: 100%; }
  .row { gap: 6px 8px; flex-wrap: nowrap; white-space: nowrap; }
  input[type=number] { width: 4.5em; }
</style>
</head>
<body>
<div class="top">
  <div class="brand"><img src="../icons/icon-48.png" alt=""><h1>Magic Tab Unloader</h1></div>
</div>

<div class="card">
  <label class="inline"><input type="checkbox" id="paused"> Pause auto-unload</label>
  <div class="row">
    <label for="defaultTimeoutMin">Unload tabs idle for</label>
    <input type="number" id="defaultTimeoutMin" min="0"> <span class="muted">min</span>
  </div>
  <label class="inline"><input type="checkbox" id="skipPinned"> Never unload pinned tabs</label>
</div>

<div class="stats muted"><small><b id="now-count">0</b> unloaded now</small><small>Today <b id="today">0</b> · Total <b id="total">0</b></small></div>
<div class="actions">
  <button id="now" class="primary">Unload idle tabs now</button>
  <button id="opts">More settings…</button>
</div>
<script src="shared.js"></script>
<script src="popup.js"></script>
</body>
</html>
